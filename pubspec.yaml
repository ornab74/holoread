name: holoread
description: Privacy-first holographic reading intelligence and reminder system.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^16.0.0
  http: ^1.5.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  collection: ^1.19.1
  cupertino_icons: ^1.0.8

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/holoread_books.csv
